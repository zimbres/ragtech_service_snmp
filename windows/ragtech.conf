# Windows configuration for Easy Pro 700 / Family 10.
# Set the COM port shown in Device Manager before running.
[serial]
port = COM3
baud_rate = 2560
data_bits = 8
parity = N
stop_bits = 1
read_timeout_ms = 1000

[ups]
poll_interval_ms = 5000
vendor_id = 0x04D8
product_id = 0x000A
iout_calib = 53.0
va_rating = 700
power_factor = 70
battery_capacity_ah = 7.0
battery_voltage_nominal = 12.0

[snmp]
bind_address = 0.0.0.0
port = 161
community = public

[general]
log_level = info
daemonize = false
pid_file =
# Default state directory: %ProgramData%/Ragtech (resolved by the application).
# To override it, specify a literal, existing parent path:
# state_directory = C:/ProgramData/Ragtech
