# Ragtech UPS SNMP Agent Configuration
# Place this file at /etc/ragtech/ragtech.conf

[serial]
# Serial port device (e.g., /dev/ttyUSB0, /dev/ttyACM0)
# For CDC-ACM devices (USB-to-serial), typically /dev/ttyACM0
port = /dev/ttyACM0

# Baud rate - Ragtech UPS typically uses 2560 baud
# Note: 2560 is non-standard; this version uses BOTHER/custom divisor via termios2 ioctl
baud_rate = 2560

# Serial parameters (8N1 typical for CDC-ACM)
data_bits = 8
parity = N
stop_bits = 1

# Read timeout in milliseconds
read_timeout_ms = 1000

[ups]
# Polling interval in milliseconds
poll_interval_ms = 5000

# USB Vendor/Product ID (for reference, not used in serial mode)
vendor_id = 0x04D8
product_id = 0x000A

# Calibration values (adjust based on your UPS model)
# V_IOUTCALIB from register 0x00F3 - will be read from device at runtime
# Fallback value used if device read fails
# Positive fallback (1-255); verify against your device calibration.
# Easy 700 TI uses family default current factor 4.30.
# Fallback 53.0 is consistent with the supplied vendor samples; device calibration takes priority.
iout_calib = 53.0

# UPS ratings
va_rating = 700
power_factor = 70

# Battery configuration (for runtime estimation when on battery)
# Easy 700 TI: 1x 12V 7Ah battery
battery_capacity_ah = 7.0
battery_voltage_nominal = 12.0

[snmp]
bind_address = 0.0.0.0
port = 161
community = public

[general]
# Log level: debug, info, warn, error
log_level = info

# Run as daemon
daemonize = false

# PID file path (used when daemonized)
pid_file = /var/run/ragtech/ragtech.pid

# Optional state directory for energy totals (default shown)
# state_directory = /var/lib/ragtech
